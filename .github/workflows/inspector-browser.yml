name: Inspector browser measurement (pre-main trial, temporary)

# GIFTED-INSPECTOR-CI (#51). Started by the independent Inspector; never a required status.
# Triggers: workflow_dispatch (Actions UI / gh), or a PR comment by the repository owner:
#   /inspector-browser sha=<40-character SHA> [strategy=strategist] [games=60] [rates=1,4,6]
# Both always run this file and the measurer from main (issue_comment workflows run from the default branch;
# workflow_dispatch is refused for any other ref). The code under inspection is the exact commit given and is
# only read as text and executed inside an offline headless Chrome page, behind a system barrier: separate
# network namespace, non-root user, Chrome sandbox, clean environment, root-owned read-only files.
# No secrets, read-only token, credentials never persisted, no pull_request_target. Any error, SHA mismatch,
# unconfirmed or missing decision fails the run. The run reports numbers; the Inspector evaluates them.
on:
  push:
    branches: ['inspector-trial/52-db7f894']
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA of the code under inspection
        required: true
        type: string
      strategy:
        description: AI strategy to measure against the Novice
        required: true
        default: strategist
        type: string
      games:
        description: Games per CPU rate (even; seats alternate p/e)
        required: true
        default: '60'
        type: string
      rates:
        description: CPU throttling rates
        required: true
        default: '1,4,6'
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: inspector-browser-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: inspector-browser-measure
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/inspector-browser '))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Resolve and validate the request (trusted main only)
        id: req
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_SHA: a0a2386219352c8e0995e107232283dfa3376d51
          IN_STRATEGY: tactician
          IN_GAMES: '60'
          IN_RATES: '1,4,6'
          BODY: ${{ github.event.comment.body }}
        run: |
          [ "$REF" = "refs/heads/inspector-trial/52-db7f894" ] || { echo "::error::run this workflow from main only (got $REF)"; exit 1; }
          SHA="$IN_SHA" STRATEGY="${IN_STRATEGY:-strategist}" GAMES="${IN_GAMES:-60}" RATES="${IN_RATES:-1,4,6}"
          if [ "$EVENT" = "issue_comment" ]; then
            line="$(printf '%s\n' "$BODY" | head -n 1 | tr -d '\r')"
            re='^/inspector-browser( (sha|strategy|games|rates)=[^ ]+)+ *$'
            [[ "$line" =~ $re ]] || { echo "::error::usage: /inspector-browser sha=<40-char SHA> [strategy=..] [games=..] [rates=..]"; exit 1; }
            SHA="" STRATEGY="strategist" GAMES="60" RATES="1,4,6"
            set -f
            for kv in ${line#/inspector-browser }; do
              case "$kv" in sha=*) SHA="${kv#sha=}";; strategy=*) STRATEGY="${kv#strategy=}";; games=*) GAMES="${kv#games=}";; rates=*) RATES="${kv#rates=}";; esac
            done
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase commit SHA"; exit 1; }
          [[ "$STRATEGY" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::invalid strategy"; exit 1; }
          [[ "$GAMES" =~ ^[0-9]{1,3}$ ]] || { echo "::error::invalid games"; exit 1; }
          [[ "$RATES" =~ ^[0-9]{1,2}(\.[0-9]+)?(,[0-9]{1,2}(\.[0-9]+)?){0,5}$ ]] || { echo "::error::invalid rates"; exit 1; }
          { echo "sha=$SHA"; echo "strategy=$STRATEGY"; echo "games=$GAMES"; echo "rates=$RATES"; } >> "$GITHUB_OUTPUT"
          echo "::notice title=Inspector browser request::sha=$SHA strategy=$STRATEGY games=$GAMES rates=$RATES (event $EVENT)"

      - name: Check out the measurer (trusted main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tool
          persist-credentials: false

      - name: Check out the code under inspection
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record environment
        run: |
          node --version
          /usr/bin/google-chrome --version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc; lscpu | grep 'Model name' || true

      - name: Prepare the isolation barrier
        run: |
          # The Chrome sandbox needs unprivileged user namespaces (restricted by AppArmor on Ubuntu 24.04).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Measurer and target become root-owned and read-only for the measuring user.
          sudo chown -R root:root tool target
          sudo chmod -R a-w,a+rX tool target
          mkdir -p "$RUNNER_TEMP/ib-home" "$RUNNER_TEMP/ib-tmp" "$RUNNER_TEMP/ib-out"
          echo "NODE_DIR=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          echo "IB_USER=$(id -un)" >> "$GITHUB_ENV"

      - name: Negative check — a strict run outside the barrier must refuse
        run: >-
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp"
          node tool/scripts/check-inspector-browser.cjs --mode=outside --chrome=/usr/bin/google-chrome

      - name: Self-test inside the barrier (positive and attack scenarios, trusted code only)
        run: >-
          sudo -n unshare --net -- runuser -u "$IB_USER" --
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp"
          node tool/scripts/check-inspector-browser.cjs --mode=isolated --chrome=/usr/bin/google-chrome

      - name: Measure the code under inspection inside the barrier
        env:
          SHA: ${{ steps.req.outputs.sha }}
          STRATEGY: ${{ steps.req.outputs.strategy }}
          GAMES: ${{ steps.req.outputs.games }}
          RATES: ${{ steps.req.outputs.rates }}
        run: >-
          sudo -n unshare --net -- runuser -u "$IB_USER" --
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp"
          INSPECTOR_IMAGE_OS="$ImageOS" INSPECTOR_IMAGE_VERSION="$ImageVersion"
          node tool/scripts/inspector-browser-measure.cjs --target=target --expect-sha="$SHA"
          --chrome=/usr/bin/google-chrome --strategy="$STRATEGY" --games="$GAMES" --rates="$RATES"
          --out="$RUNNER_TEMP/ib-out" --timeout-min=60 --isolation=strict

      - name: Publish summary
        if: always()
        run: |
          O="$RUNNER_TEMP/ib-out"
          if [ -f "$O/summary.md" ]; then
            cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"
            node -e 'const m=require(process.argv[1]),b=m.isolation.rendererSandbox;console.log(`::notice title=Inspector browser environment::${m.browser.product}; sandbox adequate=${b.adequate} seccomp=${b.seccompBpf} netns=${b.networkNamespaces}; interfaces=${m.isolation.interfaces}; uid=${m.isolation.uid}; tool ${m.tool.version} ${m.tool.commit} sha256 ${m.tool.scriptSha256}; game.js ${m.target.files["game.js"]}; strategy ${m.target.strategy.id} ${m.target.strategy.version}; ${m.environment.cpus}x ${m.environment.cpuModel}; image ${m.environment.runner.imageOS} ${m.environment.runner.imageVersion}`)' "$O/measurement.json"
            node -e 'const m=require(process.argv[1]);for(const [r,x] of Object.entries(m.results))for(const k of ["all","p","e"])console.log(`::notice title=Inspector browser ${r}x ${k}::n=${x[k].n} p50=${x[k].p50} p95=${x[k].p95} p99=${x[k].p99} max=${x[k].max} over1s=${x[k].over1s} ms; target ${m.target.sha}`)' "$O/measurement.json"
          elif [ -f "$O/error.json" ]; then
            { echo '## Inspector browser measurement FAILED'; echo '```'; cat "$O/error.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            node -e 'console.log(`::error title=Inspector browser measurement failed::${require(process.argv[1]).error}`)' "$O/error.json"
          else echo '## Inspector browser measurement FAILED before measuring' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results and raw timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-browser-${{ steps.req.outputs.sha || 'invalid' }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ib-out/
          if-no-files-found: warn
          retention-days: 90
