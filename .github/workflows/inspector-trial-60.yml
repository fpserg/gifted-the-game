name: Inspector browser trial (PR #60, before publication)

# TEMPORARY trial of an unpublished measurer version, by the method used to inspect PR #52 before publication.
# Lives only on branch inspector-trial/60 (never merged; delete it after the inspection).
# Trigger: a push to this branch. To start a run, change inspector-trial/request.txt (strictly validated):
#   tool_sha=<40-hex commit of the measurer under review, e.g. the PR #60 head>
#   target_sha=<40-hex commit of the code to measure>
#   strategies=<comma-separated identifiers>   games=<even integer>   rates=<CPU rates>
#   baseline_tool_sha=<optional 40-hex commit of the published measurer (main); its strategies are then measured
#     with it too, in the same job, for a same-machine comparison; the Novice is skipped there (unsupported)>
# Same barrier and steps as .github/workflows/inspector-browser.yml (main): read-only token, no secrets,
# credentials not persisted, outside-barrier refusal, self-test inside the barrier, strict measurement inside the
# barrier (separate network namespace, non-root, Chrome sandbox, clean environment, root-owned read-only files).
# Only difference: the measurer is checked out at tool_sha instead of main, and several strategies are measured.
on:
  push:
    branches: ['inspector-trial/60']

permissions:
  contents: read

concurrency:
  group: inspector-trial-60-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: inspector-browser-trial
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Read the request (trial branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: req
          sparse-checkout: inspector-trial
          persist-credentials: false

      - name: Validate the request
        id: req
        run: |
          f=req/inspector-trial/request.txt
          [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          get(){ grep -E "^$1=" "$f" | head -n 1 | cut -d= -f2- | tr -d '\r'; }
          TOOL="$(get tool_sha)" SHA="$(get target_sha)" STRATS="$(get strategies)" GAMES="$(get games)" RATES="$(get rates)" BASE="$(get baseline_tool_sha)"
          [ "$(grep -cvE '^(tool_sha|target_sha|strategies|games|rates|baseline_tool_sha)=[^ ]*$|^$' "$f")" = 0 ] || { echo "::error::unexpected line in request"; exit 1; }
          [ -z "$BASE" ] || [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::baseline_tool_sha must be a full 40-character SHA"; exit 1; }
          [[ "$TOOL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tool_sha must be a full 40-character SHA"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full 40-character SHA"; exit 1; }
          [[ "$STRATS" =~ ^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*){0,4}$ ]] || { echo "::error::invalid strategies"; exit 1; }
          [[ "$GAMES" =~ ^[0-9]{1,3}$ ]] || { echo "::error::invalid games"; exit 1; }
          [[ "$RATES" =~ ^[0-9]{1,2}(\.[0-9]+)?(,[0-9]{1,2}(\.[0-9]+)?){0,5}$ ]] || { echo "::error::invalid rates"; exit 1; }
          { echo "tool=$TOOL"; echo "base=$BASE"; echo "sha=$SHA"; echo "strategies=$STRATS"; echo "games=$GAMES"; echo "rates=$RATES"; } >> "$GITHUB_OUTPUT"
          echo "::notice title=Inspector trial request::tool=$TOOL target=$SHA strategies=$STRATS games=$GAMES rates=$RATES baseline=${BASE:-none} (trial commit $GITHUB_SHA)"

      - name: Check out the measurer under review (tool_sha)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.tool }}
          path: tool
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the published measurer for comparison (baseline_tool_sha, optional)
        if: steps.req.outputs.base != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.base }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the code under inspection
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record environment and measurer identity
        run: |
          node --version
          /usr/bin/google-chrome --version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc; lscpu | grep 'Model name' || true
          echo "tool commit: $(git -C tool rev-parse HEAD)"
          sha256sum tool/scripts/inspector-browser-measure.cjs tool/scripts/check-inspector-browser.cjs
          if [ -d base ]; then echo "baseline commit: $(git -C base rev-parse HEAD)"; sha256sum base/scripts/inspector-browser-measure.cjs;
            echo "::notice title=Baseline measurer::commit $(git -C base rev-parse HEAD); $(sha256sum base/scripts/inspector-browser-measure.cjs | cut -c1-64) inspector-browser-measure.cjs"; fi
          echo "::notice title=Measurer under review::commit $(git -C tool rev-parse HEAD); $(sha256sum tool/scripts/inspector-browser-measure.cjs | cut -c1-64) inspector-browser-measure.cjs; $(sha256sum tool/scripts/check-inspector-browser.cjs | cut -c1-64) check-inspector-browser.cjs"
      - name: Prepare the isolation barrier
        run: |
          # The Chrome sandbox needs unprivileged user namespaces (restricted by AppArmor on Ubuntu 24.04).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Measurer and target become root-owned and read-only for the measuring user.
          sudo chown -R root:root tool target $( [ -d base ] && echo base )
          sudo chmod -R a-w,a+rX tool target $( [ -d base ] && echo base )
          mkdir -p "$RUNNER_TEMP/ib-home" "$RUNNER_TEMP/ib-tmp" "$RUNNER_TEMP/ib-out"
          echo "NODE_DIR=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          echo "IB_USER=$(id -un)" >> "$GITHUB_ENV"

      - name: Negative check — a strict run outside the barrier must refuse
        run: >-
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp"
          node tool/scripts/check-inspector-browser.cjs --mode=outside --chrome=/usr/bin/google-chrome

      - name: Self-test inside the barrier (positive and attack scenarios, trusted code only)
        run: >-
          sudo -n unshare --net -- runuser -u "$IB_USER" --
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp"
          node tool/scripts/check-inspector-browser.cjs --mode=isolated --chrome=/usr/bin/google-chrome

      - name: Measure the code under inspection inside the barrier (each strategy)
        env:
          SHA: ${{ steps.req.outputs.sha }}
          STRATS: ${{ steps.req.outputs.strategies }}
          GAMES: ${{ steps.req.outputs.games }}
          RATES: ${{ steps.req.outputs.rates }}
        run: |
          set -f
          for STRATEGY in ${STRATS//,/ }; do
            mkdir -p "$RUNNER_TEMP/ib-out/$STRATEGY"
            sudo -n unshare --net -- runuser -u "$IB_USER" -- \
            env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp" \
            INSPECTOR_IMAGE_OS="$ImageOS" INSPECTOR_IMAGE_VERSION="$ImageVersion" \
            node tool/scripts/inspector-browser-measure.cjs --target=target --expect-sha="$SHA" \
            --chrome=/usr/bin/google-chrome --strategy="$STRATEGY" --games="$GAMES" --rates="$RATES" \
            --out="$RUNNER_TEMP/ib-out/$STRATEGY" --timeout-min=60 --isolation=strict
          done

      - name: Measure with the published measurer for comparison (same job, same barrier)
        if: steps.req.outputs.base != ''
        env:
          SHA: ${{ steps.req.outputs.sha }}
          STRATS: ${{ steps.req.outputs.strategies }}
          GAMES: ${{ steps.req.outputs.games }}
          RATES: ${{ steps.req.outputs.rates }}
        run: |
          set -f
          for STRATEGY in ${STRATS//,/ }; do
            [ "$STRATEGY" = novice ] && continue
            mkdir -p "$RUNNER_TEMP/ib-out/baseline-$STRATEGY"
            sudo -n unshare --net -- runuser -u "$IB_USER" -- \
            env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$RUNNER_TEMP/ib-home" TMPDIR="$RUNNER_TEMP/ib-tmp" \
            INSPECTOR_IMAGE_OS="$ImageOS" INSPECTOR_IMAGE_VERSION="$ImageVersion" \
            node base/scripts/inspector-browser-measure.cjs --target=target --expect-sha="$SHA" \
            --chrome=/usr/bin/google-chrome --strategy="$STRATEGY" --games="$GAMES" --rates="$RATES" \
            --out="$RUNNER_TEMP/ib-out/baseline-$STRATEGY" --timeout-min=60 --isolation=strict
          done

      - name: Publish summary
        if: always()
        env:
          STRATS: ${{ steps.req.outputs.strategies }}
        run: |
          set -f
          for S in ${STRATS//,/ } $(cd "$RUNNER_TEMP/ib-out" && ls -d baseline-* 2>/dev/null); do
            O="$RUNNER_TEMP/ib-out/$S"
            if [ -f "$O/summary.md" ]; then
              cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"
              node -e 'const m=require(process.argv[1]),b=m.isolation.rendererSandbox,R=Object.entries(m.results);console.log(`::notice title=${m.tool.version} ${m.params.strategy}::p95 all ${R.map(([r,x])=>r+"x "+x.all.p95).join(", ")} ms; p95 p/e ${R.map(([r,x])=>r+"x "+x.p.p95+"/"+x.e.p95).join(", ")}; max ${R.map(([r,x])=>r+"x "+x.all.max).join(", ")}; >1s ${R.map(([r,x])=>x.all.over1s).join("/")}; n ${R.map(([r,x])=>x.all.n).join("/")}; opponent confirmed ${m.verification.opponentDecisionsConfirmed??"-"}; tool ${m.tool.commit} ${m.tool.scriptSha256}; target ${m.target.sha}; game.js ${m.target.files["game.js"]}; ${m.browser.product}; sandbox ${b.adequate&&b.seccompBpf&&b.networkNamespaces}; if ${m.isolation.interfaces}; uid ${m.isolation.uid}; ${m.environment.cpus}x ${m.environment.cpuModel}`)' "$O/measurement.json"
            elif [ -f "$O/error.json" ]; then
              { echo "## Inspector trial $S FAILED"; echo '```'; cat "$O/error.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              node -e 'console.log(`::error title=Inspector trial measurement failed::${require(process.argv[1]).error}`)' "$O/error.json"
            else echo "## Inspector trial $S not measured" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload results and raw timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-trial-60-${{ steps.req.outputs.tool || 'invalid' }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ib-out/
          if-no-files-found: warn
          retention-days: 90
