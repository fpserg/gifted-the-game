name: Alpha CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: alpha-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: alpha-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check tutorial.js
          node --check service-worker.js
      - name: Check medallion image binaries
        run: node scripts/check-menu-assets-smoke.cjs
      - name: Run tutorial and UI regressions
        run: |
          node scripts/check-first-battle.cjs
          node scripts/check-ui.cjs
          node scripts/check-menu-remediation.cjs
      - name: Run PWA cache regressions
        run: node scripts/check-pwa-navigation-cache.cjs
      # GIFTED-004B-CI (#44). The Novice reference is the fixed commit 2923eaf (AI_BASELINE.baseCommit
      # in game.js), never the moving HEAD. The checkout is shallow, so that one commit is fetched
      # explicitly with the read-only token; a missing commit makes the check fail.
      - name: Fetch fixed AI baseline commit (novice-1)
        run: git fetch --no-tags --depth=1 origin 2923eafca24d8b23ec0b3de71306ca555919b782
      - name: Run AI architecture and Novice baseline checks
        run: node scripts/check-ai-architecture.cjs 2923eafca24d8b23ec0b3de71306ca555919b782
      - name: Run Tactician checks
        run: node scripts/check-tactician.cjs
      - name: Run AI mutation checks
        run: node scripts/check-ai-mutations.cjs
      - name: Run balance simulator check
        run: node scripts/check-simulate-balance.cjs
