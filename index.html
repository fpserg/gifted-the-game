<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160f0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game of Gifts">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<title>Game of Gifts</title>
<link rel="stylesheet" href="styles.css?v=menu-fix1">
</head>
<body>
<div id="app">
  <div class="bar"><div class="who" id="eWho"></div><div style="display:flex;gap:6px;align-items:center"><button class="lbtn" id="menuBtn" type="button" hidden>Меню</button><button class="lbtn" id="libBtn">Карты</button><button class="lbtn" id="helpBtn" aria-label="Обучение">?</button><div id="turn"></div></div></div>
  <div id="opponentReserve" class="reserve"></div>
  <div id="board"></div>
  <div id="log" aria-live="polite"></div>
  <div id="info" aria-live="polite"></div>
  <aside id="coach" class="hide" aria-live="polite"></aside>
  <div id="bottom"><div class="who" id="pWho"></div><div id="energy"></div><button id="end">Завершить ход</button></div>
  <div id="playerDeck"></div>
  <div id="hand"></div>
</div>
<div id="ov"><div class="box" id="ovbox"></div></div>
<script src="tutorial.js?v=menu-fix1" defer></script>
<script src="game.js?v=menu-fix1" defer></script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));</script>
</body>
</html>
